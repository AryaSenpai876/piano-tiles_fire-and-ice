name: aryasenpai_piano
description: "a simple piano tiles-like games, but the sound is memes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  flutter_animate: ^4.5.0
  video_player: ^2.8.1
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FF0000" # Red background for Android adaptive icons
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/import/map/
    - assets/import/music/
    - assets/import/background/
